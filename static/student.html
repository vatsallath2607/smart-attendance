<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body id="student">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card p-4">
                    <h1 class="card-title text-center" style="color: var(--primary-dark);"><i class="fas fa-user-check me-2"></i>Student Attendance</h1>

                    <div class="mb-3">
                        <label for="reg_no" class="form-label fw-bold">Registration No:</label>
                        <input id="reg_no" class="form-control" placeholder="Enter registration number">
                    </div>

                    <div class="mb-3">
                        <label for="session_code" class="form-label fw-bold"><i class="fas fa-key me-1 text-success"></i>Session Code:</label>
                        <input id="session_code" class="form-control" placeholder="Enter session code (e.g. SES-XXXXXX)">
                    </div>

                    <div class="mb-3">
                        <label for="range_code" class="form-label fw-bold"><i class="fas fa-location-crosshairs me-1 text-primary"></i>Range Code (10m):</label>
                        <input id="range_code" class="form-control" placeholder="Enter 10m range code (e.g. RNG-XXXXXX)">
                    </div>

                    <div class="mb-3">
                        <label for="section_select" class="form-label fw-bold">Section:</label>
                        <select id="section_select" class="form-select">
                            <option value="">Loading sections…</option>
                        </select>
                    </div>

                    <div id="gps-status" class="alert alert-light border py-2 px-3 mb-3 d-flex align-items-center justify-content-between">
                        <div class="small text-muted">
                            <i class="fas fa-location-crosshairs text-primary me-1"></i>
                            <span id="gps-text">GPS location verified on submission</span>
                        </div>
                        <button type="button" id="btn-detect-gps" class="btn btn-outline-primary btn-sm py-0 px-2" style="font-size:0.75rem;">
                            Check GPS
                        </button>
                    </div>

                    <div class="d-grid gap-2 d-md-block my-3 text-center">
                        <button id="startCam" class="btn btn-primary"><i class="fas fa-video me-2"></i>Start Camera</button>
                        <button id="snap" class="btn btn-warning" disabled><i class="fas fa-camera me-2"></i>Capture</button>
                    </div>

                    <div class="text-center">
                        <video id="video" autoplay playsinline></video>
                        <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
                    </div>

                    <div id="msg" class="msg alert alert-info mt-3 text-center fw-bold" role="alert">
                        Ready to start camera.
                    </div>

                    <button id="submit" class="btn btn-success btn-lg mt-3" disabled>
                        <i class="fas fa-check-circle me-2"></i>Submit Attendance
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
    (async function(){
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const sectionSelect = document.getElementById('section_select');
        const sessionCodeInput = document.getElementById('session_code');
        const rangeCodeInput = document.getElementById('range_code');
        const regInput = document.getElementById('reg_no');
        const msg = document.getElementById('msg');
    
        // Helper: read ?session_code=...&range_code=...&section=... from URL and auto-fill
        function readUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const session_code = params.get('session_code') || params.get('code');
            const range_code = params.get('range_code');
            const section = params.get('section');
            return { session_code, range_code, section };
        }
        
        function updateMsgAlert(text, type) {
            // Remove all existing alert classes before adding the new one
            msg.className = msg.className.replace(/\balert-(info|success|warning|danger|primary)\b/g, '');
            msg.className = `msg alert alert-${type} mt-3 text-center fw-bold`;
            msg.innerHTML = text;
        }

        // Fetch sections from backend and populate dropdown
        async function loadSections() {
            try {
                const res = await fetch('/api/sections');
                const j = await res.json();
                if (j.success) {
                    sectionSelect.innerHTML = ''; // clear
                    if (j.sections.length === 0) {
                        const o = document.createElement('option');
                        o.value = '';
                        o.text = 'No sections available';
                        sectionSelect.appendChild(o);
                        return;
                    }
                    for (const s of j.sections) {
                        const opt = document.createElement('option');
                        opt.value = s.id;
                        opt.text = s.name;
                        sectionSelect.appendChild(opt);
                    }
                    // If URL had a numeric section parameter, set it
                    const { section } = readUrlParams();
                    if (section) {
                        const optionByValue = sectionSelect.querySelector(`option[value="${section}"]`);
                        if (optionByValue) {
                            optionByValue.selected = true;
                        } else {
                            for (const opt of sectionSelect.options) {
                                if (opt.text === section) { opt.selected = true; break; }
                            }
                        }
                    }
                } else {
                    updateMsgAlert('Failed to load sections.', 'danger');
                }
            } catch (e) {
                updateMsgAlert('Error loading sections.', 'danger');
                console.error('Failed to load sections', e);
            }
        }
    
        // load sections on page load
        await loadSections();
    
        // auto-fill codes from URL if present
        const { session_code, range_code } = readUrlParams();
        if (session_code) sessionCodeInput.value = session_code;
        if (range_code) rangeCodeInput.value = range_code;
    
        // GPS check button handler
        const btnDetectGps = document.getElementById('btn-detect-gps');
        const gpsText = document.getElementById('gps-text');
        if (btnDetectGps) {
            btnDetectGps.onclick = () => {
                if (!navigator.geolocation) {
                    gpsText.innerHTML = '<span class="text-danger"><i class="fas fa-times-circle"></i> Geolocation not supported</span>';
                    return;
                }
                gpsText.innerHTML = '<i class="fas fa-spinner fa-spin text-primary"></i> Detecting location...';
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        gpsText.innerHTML = `<span class="text-success"><i class="fas fa-check-circle"></i> GPS Ready (±${Math.round(pos.coords.accuracy)}m)</span>`;
                    },
                    err => {
                        gpsText.innerHTML = `<span class="text-danger"><i class="fas fa-exclamation-triangle"></i> Location Error: ${err.message}</span>`;
                    },
                    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
                );
            };
        }

        // Camera handlers
        let stream;
        document.getElementById('startCam').onclick = async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                document.getElementById('snap').disabled = false;
                updateMsgAlert('Camera started — click Capture when ready.', 'warning');
            } catch (err) {
                console.error(err);
                updateMsgAlert('Unable to access camera: ' + (err.message || err), 'danger');
            }
        };
    
        document.getElementById('snap').onclick = () => {
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            document.getElementById('submit').disabled = false;
            updateMsgAlert('Captured. Click Submit Attendance.', 'primary');
        };
    
        document.getElementById('submit').onclick = async () => {
            const reg = regInput.value.trim();
            const sessionCodeVal = sessionCodeInput.value.trim();
            const rangeCodeVal = rangeCodeInput.value.trim();
            const sectionId = sectionSelect.value; // numeric id

            if (!reg) {
                updateMsgAlert('Please enter your Registration Number.', 'danger');
                return;
            }
            if (!sessionCodeVal) {
                updateMsgAlert('Session Code is required! Please enter the Session Code.', 'danger');
                return;
            }
            if (!rangeCodeVal) {
                updateMsgAlert('Range Code is required! Please enter the Range Code.', 'danger');
                return;
            }
            if (!sectionId) {
                updateMsgAlert('Please select a section.', 'danger');
                return;
            }

            updateMsgAlert('<i class="fas fa-satellite-dish fa-spin me-1"></i> Calibrating high-accuracy GPS & verifying location...', 'info');

            // Attempt to get high-accuracy GPS coordinates with accuracy reading
            let studentCoords = null;
            if (navigator.geolocation) {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        let bestPos = null;
                        let watchId = navigator.geolocation.watchPosition(
                            p => {
                                if (!bestPos || p.coords.accuracy < bestPos.coords.accuracy) {
                                    bestPos = p;
                                }
                                if (p.coords.accuracy <= 20) {
                                    navigator.geolocation.clearWatch(watchId);
                                    resolve(bestPos);
                                }
                            },
                            err => {
                                if (bestPos) {
                                    navigator.geolocation.clearWatch(watchId);
                                    resolve(bestPos);
                                } else {
                                    navigator.geolocation.clearWatch(watchId);
                                    reject(err);
                                }
                            },
                            { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 }
                        );
                        // Timeout fallback to current best
                        setTimeout(() => {
                            navigator.geolocation.clearWatch(watchId);
                            if (bestPos) resolve(bestPos);
                            else navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 4000, maximumAge: 0 });
                        }, 5000);
                    });
                    studentCoords = {
                        latitude: pos.coords.latitude,
                        longitude: pos.coords.longitude,
                        accuracy: pos.coords.accuracy
                    };
                    if (gpsText) {
                        gpsText.innerHTML = `<span class="text-success"><i class="fas fa-check-circle"></i> GPS Calibrated (±${Math.round(pos.coords.accuracy)}m)</span>`;
                    }
                } catch (geoErr) {
                    console.warn('Geolocation acquisition failed or denied:', geoErr);
                    if (gpsText) {
                        gpsText.innerHTML = `<span class="text-warning"><i class="fas fa-exclamation-triangle"></i> GPS not acquired: ${geoErr.message}</span>`;
                    }
                }
            }
    
            const dataUrl = canvas.toDataURL('image/jpeg'); // base64
    
            const form = new FormData();
            form.append('reg_no', reg);
            form.append('session_code', sessionCodeVal);
            form.append('code', sessionCodeVal); // also send as code for backwards compatibility
            form.append('range_code', rangeCodeVal);
            form.append('section', sectionId);
            form.append('image_base64', dataUrl);

            if (studentCoords) {
                form.append('latitude', studentCoords.latitude);
                form.append('longitude', studentCoords.longitude);
                if (studentCoords.accuracy) form.append('accuracy', studentCoords.accuracy);
            }
    
            try {
                const res = await fetch('/api/submit_attendance', { method: 'POST', body: form });
                const j = await res.json();
                if (j.success) {
                    updateMsgAlert(`<i class="fas fa-check-circle me-1"></i> ${j.msg || 'Attendance recorded successfully!'}`, 'success');
                    document.getElementById('submit').disabled = true;
                } else {
                    updateMsgAlert(`<i class="fas fa-times-circle me-1"></i> ${j.msg || 'Failed to submit attendance.'}`, 'danger');
                }
            } catch (err) {
                console.error(err);
                updateMsgAlert('Submission failed: ' + (err.message || err), 'danger');
            }
        };
    
    })();
    </script>
</body>
</html>
