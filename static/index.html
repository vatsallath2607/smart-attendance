<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance System - Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1f4037, #99f2c8);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .portal-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 550px;
            width: 100%;
            text-align: center;
        }
        .btn-portal {
            padding: 16px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
        }
        .btn-portal:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="mb-4">
            <i class="fas fa-camera-retro fa-3x text-success mb-3"></i>
            <h2 class="fw-bold text-dark">Smart Attendance System</h2>
            <p class="text-muted">Facial Recognition • 10m Geofencing Range • Dual Session Codes</p>
        </div>
        
        <div class="d-grid gap-3">
            <a href="/faculty.html" class="btn btn-primary btn-portal">
                <i class="fas fa-chalkboard-teacher fa-lg"></i>
                <span>Faculty Dashboard</span>
            </a>
            <a href="/student.html" class="btn btn-outline-success btn-portal">
                <i class="fas fa-user-graduate fa-lg"></i>
                <span>Student Attendance Portal</span>
            </a>
        </div>
        
        <hr class="my-4">
        <div class="small text-muted">
            <i class="fas fa-location-dot text-danger me-1"></i>
            Geofence range verification and face matching active.
        </div>
    </div>
</body>
</html>
